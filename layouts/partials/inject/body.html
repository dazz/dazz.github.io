{{ with site.Params.googleAnalyticsID }}
<script>
    document.documentElement.dataset.googleAnalyticsId = {{ . | jsonify | safeJS }};
</script>
<script type="text/plain" data-category="analytics">
    window['ga-disable-{{ . }}'] = false;
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ . }}', {
        allow_google_signals: false,
        allow_ad_personalization_signals: false,
        cookie_expires: 15552000
    });
</script>
<script
    type="text/plain"
    data-category="analytics"
    async
    data-src="https://www.googletagmanager.com/gtag/js?id={{ . }}"
></script>
{{ end }}
<script src="/vendor/cookieconsent/cookieconsent.umd.js"></script>
<script src="/js/cookieconsent-config.js"></script>
